<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Samuel Horner - Portfolio</title>

    <script>
        // Pick the theme before the page draws so it never flashes the wrong colours
        try { var savedTheme = localStorage.getItem("theme"); } catch (e) {}
        document.documentElement.dataset.theme = savedTheme ||
            (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");

        // Just left a section page: start zoomed into its block (see script.js)
        try {
            var trip = JSON.parse(sessionStorage.getItem("zoom-out") || "null");
            sessionStorage.removeItem("zoom-out");
            if (trip && Date.now() - trip.time < 4000 && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
                document.documentElement.classList.add("is-returning");
                document.documentElement.dataset.returning = trip.section;
            }
        } catch (e) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">
    <link rel="stylesheet" href="StyleSheet.css">
    <script src="theme.js" defer></script>
    <script src="script.js" defer></script>
</head>

<body>
    <!-- A solid block of colour, used for the zoom into a section and back out -->
    <div class="zoom-cover" aria-hidden="true"></div>

    <!-- The wire from the push button to the chip. theme.js draws it to fit the screen. -->
    <svg class="wire-layer" aria-hidden="true">
        <path class="wire" />
        <path class="wire-pulse" />
    </svg>

    <header class="corners">

        </nav>

        <!-- Dark mode push button (a 6mm tactile switch, seen from above) -->
        <button class="power-switch" type="button" aria-label="Dark mode" aria-pressed="false">
            <svg class="switch" viewBox="0 0 64 78" aria-hidden="true">
                <rect class="switch__leg" id="switch-terminal" x="13" y="50" width="6" height="26" rx="1.5" />
                <rect class="switch__leg" x="45" y="50" width="6" height="26" rx="1.5" />
                <rect class="switch__body-shade" x="8" y="8" width="54" height="54" rx="5" />
                <rect class="switch__body" x="4" y="4" width="54" height="54" rx="5" />
                <rect class="switch__plate" x="8" y="8" width="46" height="46" rx="3" />
                <circle class="switch__peg" cx="14" cy="14" r="4" />
                <circle class="switch__peg" cx="48" cy="14" r="4" />
                <circle class="switch__peg" cx="14" cy="48" r="4" />
                <circle class="switch__peg" cx="48" cy="48" r="4" />
                <circle class="switch__cap-shade" cx="33.5" cy="33.5" r="13" />
                <g class="switch__cap">
                    <circle class="switch__cap-top" cx="31" cy="31" r="13" />
                    <path class="switch__cap-shine" d="M22.5 29a9 9 0 0 1 6.5-6.8" />
                </g>
            </svg>
        </button>
    </header>

    <main id="content">
        <h1 class="name">Samuel Horner</h1>

        <nav class="chip" aria-label="Portfolio sections">
            <svg class="cpu" viewBox="0 0 664 700">
                <defs>
                    <!-- Gold contacts across the package -->
                    <pattern id="contact-dots" x="8" y="8" width="12" height="12" patternUnits="userSpaceOnUse">
                        <circle class="contact" cx="6" cy="6" r="2.3" />
                    </pattern>

                    <!-- A single pin, repeated along the bottom edge -->
                    <pattern id="pin-row" x="20" y="652" width="24" height="44" patternUnits="userSpaceOnUse">
                        <rect class="pin" x="8" y="0" width="8" height="40" rx="2" />
                        <rect class="pin-shade" x="12.5" y="0" width="3.5" height="40" rx="1" />
                    </pattern>
                </defs>

                <!-- Package, die and core outline (decoration only) -->
                <g aria-hidden="true">
                    <rect x="20" y="652" width="624" height="44" fill="url(#pin-row)" />
                    <rect class="pcb-edge" x="16" y="16" width="648" height="648" rx="14" />
                    <rect class="pcb" x="8" y="8" width="648" height="648" rx="14" />
                    <rect x="8" y="8" width="648" height="648" rx="14" fill="url(#contact-dots)" />
                    <rect class="die" x="56" y="56" width="552" height="552" rx="8" />

                    <rect class="core" x="250" y="74" width="164" height="374" rx="6" />
                    <rect class="core-tag-bg" x="258" y="66" width="46" height="16" />
                    <text class="core-tag" x="265" y="78">CORE</text>
                </g>

                <!-- Bus traces. data-connects lists the sections each trace joins (used by script.js) -->
                <g aria-hidden="true">
                    <path class="trace" data-connects="about work" d="M270 140H149V176" />
                    <path class="trace" data-connects="about volunteer" d="M394 140H515V176" />
                    <path class="trace" data-connects="about resume" d="M302 176V226" />
                    <path class="trace" data-connects="about resume" d="M362 176V226" />
                    <path class="trace" data-connects="resume work" d="M270 262H216" />
                    <path class="trace" data-connects="resume volunteer" d="M394 262H448" />
                    <path class="trace" data-connects="resume projects" d="M302 298V348" />
                    <path class="trace" data-connects="resume projects" d="M362 298V348" />
                    <path class="trace" data-connects="projects work" d="M270 384H216" />
                    <path class="trace" data-connects="projects volunteer" d="M394 384H448" />
                    <path class="trace" data-connects="work contact" d="M149 420V518H232" />
                    <path class="trace" data-connects="volunteer contact" d="M515 420V518H432" />
                    <path class="trace" data-connects="contact" d="M332 550V608" />

                    <!-- Input line from the dark mode button to the control unit -->
                    <path class="input-trace" d="M560 14V112H394" />
                    <path class="input-pulse" d="M560 14V112H394" />
                    <rect class="pad" id="wire-pad" x="551" y="2" width="18" height="14" rx="2" />
                </g>

                <!--
                    The sections. data-zoom makes the chip zoom into that block on the way
                    to its page; the resume is a PDF, so it just opens in a new tab.
                -->
                <a class="unit unit--control" href="about.html" aria-label="About me"
                   data-section="about" data-zoom data-blurb="Who I am and what I'm working towards.">
                    <rect class="unit__shadow" x="268" y="102" width="140" height="88" rx="4" />
                    <g class="unit__face">
                        <rect class="unit__body" x="262" y="96" width="140" height="88" rx="4" />
                        <text class="unit__caption" x="274" y="116">CONTROL UNIT</text>
                        <text class="unit__label" x="332" y="154">About me</text>
                    </g>
                </a>

                <a class="unit unit--cache" href="work.html" aria-label="Work experience"
                   data-section="work" data-zoom data-blurb="Jobs I've held and what I did in them.">
                    <rect class="unit__shadow" x="80" y="172" width="150" height="262" rx="4" />
                    <g class="unit__face">
                        <rect class="unit__body" x="74" y="166" width="150" height="262" rx="4" />
                        <text class="unit__caption" x="86" y="186">L1 DATA CACHE</text>
                        <text class="unit__label"><tspan x="149" y="293">Work</tspan><tspan x="149" y="322">experience</tspan></text>
                    </g>
                </a>

                <!-- The resume is a PDF, so it opens in a new tab instead of zooming -->
                <a class="unit unit--alu" href="data/Samuel_Horner_Resume_2026.pdf" target="_blank" rel="noopener"
                   aria-label="Resume (PDF, opens in a new tab)"
                   data-section="resume" data-blurb="My resume as a PDF, in a new tab.">
                    <rect class="unit__shadow" x="268" y="224" width="140" height="88" rx="4" />
                    <g class="unit__face">
                        <rect class="unit__body" x="262" y="218" width="140" height="88" rx="4" />
                        <text class="unit__caption" x="274" y="238">ALU</text>
                        <text class="unit__label" x="332" y="276">Resume</text>
                    </g>
                </a>

                <a class="unit unit--cache" href="volunteer.html" aria-label="Volunteer experience"
                   data-section="volunteer" data-zoom data-blurb="Where I've volunteered and what I did.">
                    <rect class="unit__shadow" x="446" y="172" width="150" height="262" rx="4" />
                    <g class="unit__face">
                        <rect class="unit__body" x="440" y="166" width="150" height="262" rx="4" />
                        <text class="unit__caption" x="452" y="186">L1 INSTR. CACHE</text>
                        <text class="unit__label"><tspan x="515" y="293">Volunteer</tspan><tspan x="515" y="322">experience</tspan></text>
                    </g>
                </a>

                <a class="unit unit--registers" href="projects.html" aria-label="Projects"
                   data-section="projects" data-zoom data-blurb="Load a project into the registers to see what's inside.">
                    <rect class="unit__shadow" x="268" y="346" width="140" height="88" rx="4" />
                    <g class="unit__face">
                        <rect class="unit__body" x="262" y="340" width="140" height="88" rx="4" />
                        <text class="unit__caption" x="274" y="360">REGISTERS</text>
                        <text class="unit__label" x="332" y="398">Projects</text>
                    </g>
                </a>

                <!-- Contact doesn't leave the page: clicking it copies the email address -->
                <a class="unit unit--bus" href="#contact" aria-label="Contact: copy my email address"
                   aria-describedby="contact" data-section="contact">
                    <rect class="unit__shadow" x="230" y="484" width="216" height="80" rx="4" />
                    <g class="unit__face">
                        <rect class="unit__body" x="224" y="478" width="216" height="80" rx="4" />
                        <text class="unit__caption" x="236" y="498">BUS MANAGEMENT UNIT</text>
                        <text class="unit__label" x="332" y="536">Contact</text>
                    </g>
                </a>
            </svg>
        </nav>

        <div class="readout">
            <p class="readout__text">Select a component to explore.</p>

            <p class="readout__contact" id="contact" hidden>
                <span class="readout__key">Email</span>
                <span class="email">samuelhorner123[at]gmail.com</span>
                <span class="readout__hint">Click Contact to copy</span>
            </p>

            <!-- Announces "copied" to screen readers -->
            <p class="visually-hidden" role="status" aria-live="polite"></p>
        </div>
    </main>
</body>
</html>
