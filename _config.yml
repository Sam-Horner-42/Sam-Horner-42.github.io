# Site Settings
title: "Your Name | Portfolio"
description: "Computer Engineering Technology student and software developer showcasing projects in C++, Android, and game dev."
url: "https://yourusername.github.io" # Replace with your GitHub username
baseurl: "" # Leave empty if using a user/organization page (username.github.io)

# Author Info
author:
  name: "Your Name"
  email: "your.email@example.com"
  github: "yourusername"
  linkedin: "yourusername"

# Build Settings
theme: minima # You can change this to any supported theme or custom remote theme
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Exclude from processing
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock